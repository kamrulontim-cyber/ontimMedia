<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ফটোকার্ড মেকার</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#2563eb; --ink:#14224f; --bg:#f1f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:"Noto Sans Bengali",sans-serif; color:#222; padding:16px; }
  .panel { background:#fff; border-radius:24px; padding:24px; max-width:640px; margin:0 auto 24px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:26px; color:var(--ink); }
  .sub { margin:0 0 16px; color:#555; font-size:15px; }
  .box { background:#eef4ff; border:1px solid #cfe0ff; border-radius:16px; padding:16px; margin:16px 0; }
  label { display:block; font-weight:700; color:var(--ink); margin:16px 0 8px; }
  textarea, input[type=text] { width:100%; border:1px solid #cbd5e1; border-radius:12px; padding:14px; font:inherit; background:#f8fafc; }
  textarea { height:110px; resize:vertical; }
  input[type=file] { font:inherit; max-width:100%; }
  input[type=file]::file-selector-button { background:var(--blue); color:#fff; border:0; border-radius:999px; padding:12px 20px; font:inherit; font-weight:700; margin-right:10px; }
  button.dl { width:100%; background:var(--blue); color:#fff; border:0; border-radius:14px; padding:16px; font:inherit; font-weight:800; font-size:18px; margin-top:20px; }
  .preview { max-width:640px; margin:0 auto 40px; }
  canvas { width:100%; height:auto; display:block; box-shadow:0 2px 12px rgba(0,0,0,.2); background:#fff; }
</style>
</head>
<body>

<div class="panel">
  <h1>ফটোকার্ড মেকার</h1>
  <p class="sub">আপনার ক্রিয়েটিভিটির প্রমাণ দিন</p>

  <div class="box">
    <label style="margin-top:0">১. ছবি নির্বাচন করুন (১-২টি)</label>
    <input type="file" id="photos" accept="image/*" multiple>
  </div>

  <label>২. সংবাদ শিরোনাম</label>
  <textarea id="headline" placeholder="এখানে সংবাদ লিখুন..."></textarea>

  <label>৩. সূত্র বা প্রতিবেদকের নাম</label>
  <input type="text" id="source" placeholder="যেমন: নিজস্ব প্রতিবেদক">

  <button class="dl" id="download">ফটোকার্ড ডাউনলোড করুন</button>
</div>

<div class="preview"><canvas id="card" width="1058" height="1056"></canvas></div>

<script>
const W = 1058, H = 1056, PHOTO_H = 615;
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');
const FONT = '"Noto Sans Bengali", sans-serif';

let photos = [];
const template = new Image();
const logo = new Image();
template.onload = draw; logo.onload = draw;
template.src = 'template.png';   // ডিজাইনের ব্যাকগ্রাউন্ড
logo.src = 'logo.png';           // লোগো

function drawCover(img, x, y, w, h) {
  const r = Math.max(w / img.width, h / img.height);
  const sw = w / r, sh = h / r;
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
}

function wrap(text, maxW) {
  const words = text.trim().split(/\s+/).filter(Boolean);
  const lines = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
    else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x, y + h); ctx.closePath();
}

function draw() {
  const headline = document.getElementById('headline').value;
  const source = document.getElementById('source').value.trim();

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);

  // 1) ছবি (উপরের অংশ)
  ctx.fillStyle = '#2a0f1c'; ctx.fillRect(0, 0, W, PHOTO_H);
  if (photos.length === 1) {
    drawCover(photos[0], 0, 0, W, PHOTO_H);
  } else if (photos.length >= 2) {
    const gap = 6, half = (W - gap) / 2;
    drawCover(photos[0], 0, 0, half, PHOTO_H);
    drawCover(photos[1], half + gap, 0, half, PHOTO_H);
  }

  // 2) ডিজাইন টেমপ্লেট
  if (template.complete && template.naturalWidth) ctx.drawImage(template, 0, 0, W, H);

  // 3) লোগো
  if (logo.complete && logo.naturalWidth) {
    // উপরে বাঁয়ে সাদা ট্যাব
    ctx.fillStyle = '#fff'; roundRect(-30, 42, 142, 80, 40); ctx.fill();
    ctx.drawImage(logo, 28, 46, 72, 72);
    // মাঝখানের গোল লোগো
    ctx.beginPath(); ctx.arc(529, 612, 54, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.drawImage(logo, 479, 562, 100, 100);
  }

  // 4) প্রতিবেদকের নাম (ছবির নিচে বাঁয়ে)
  if (source) {
    ctx.font = `700 30px ${FONT}`;
    const tw = Math.min(ctx.measureText(source).width, 400);
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    roundRect(24, PHOTO_H - 74, tw + 36, 52, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(source, 42, PHOTO_H - 47, 400);
  }

  // 5) শিরোনাম (মাঝের ধূসর অংশে)
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const top = 690, bottom = 872, maxW = W - 120;
  const text = headline.trim() || 'এখানে আপনার সংবাদ শিরোনাম দেখা যাবে';
  let size = 64, lines;
  while (size > 26) {
    ctx.font = `800 ${size}px ${FONT}`;
    lines = wrap(text, maxW);
    if (lines.length * size * 1.3 <= bottom - top) break;
    size -= 2;
  }
  ctx.fillStyle = headline.trim() ? '#111827' : '#9ca3af';
  const blockH = lines.length * size * 1.3;
  const startY = top + (bottom - top - blockH) / 2 + size * 1.0;
  lines.forEach((l, i) => ctx.fillText(l, W / 2, startY + i * size * 1.3));
}

document.getElementById('photos').addEventListener('change', async (e) => {
  const files = [...e.target.files].slice(0, 2);
  photos = await Promise.all(files.map(f => new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = URL.createObjectURL(f);
  })));
  draw();
});
['headline', 'source'].forEach(id => document.getElementById(id).addEventListener('input', draw));

document.getElementById('download').addEventListener('click', () => {
  canvas.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'photocard.png';
    a.click();
  }, 'image/png');
});

draw();
document.fonts.load(`800 40px ${FONT}`).then(() => document.fonts.ready).then(draw);
</script>
</body>
</html>
